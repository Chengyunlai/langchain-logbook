[project]
name = "langchain-logbook"
version = "0.1.0"
description = "LangChain / LangGraph Agent 工程中文课程与 Mini DeerFlow 实战"
readme = "README.md"
authors = [{ name = "Cyrus" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0,<0.140",
    "jieba>=0.42.1,<0.43",
    "langchain>=1.3.13,<1.4",
    "langchain-chroma>=1.1.0,<2",
    "langchain-classic>=1.0.3,<2",
    "langchain-community>=0.4.1,<0.5",
    "langchain-core>=1.4.9,<1.5",
    "langchain-deepseek>=1.0.1,<2",
    "langchain-openai>=1.1.12,<2",
    "langchain-text-splitters>=1.1.1,<2",
    "langfuse>=4.0.6,<5",
    "langgraph>=1.2.9,<1.3",
    "langgraph-checkpoint-sqlite>=3,<4",
    "langsmith>=0.10.2,<0.11",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.2.2,<2",
    "pyyaml>=6.0.3,<7",
    "rank-bm25>=0.2.2,<0.3",
    "requests>=2.32,<3",
    "typing-extensions>=4.15,<5",
]

[project.optional-dependencies]
mcp = [
    "langchain-mcp-adapters>=0.3.0,<0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mini_deerflow"]

[dependency-groups]
dev = [
    "bpython>=0.26,<0.27",
    "ipykernel>=7.2,<8",
    "httpx>=0.28,<0.29",
    "jupyter>=1.1,<2",
    "nbformat>=5.10,<6",
    "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly configured external model or service",
]
